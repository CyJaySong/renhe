    # password: ""
    # minIdle: 10
    # maxIdle: 50
    # maxActive: 200
    # idleTimeout: "5m"
    # maxConnLifetime: "1h"
    # dialTimeout: "5s"
    # readTimeout: "3s"
    # writeTimeout: "3s"

logger:
  level: "info"
