httpSrv:
  address: ":8000"

database:
  default:
    # 连接池配置
    maxOpenConns: 25
    maxIdleConns: 5
    connMaxLifetime: "1h"
    connMaxIdleTime: "30m"
    # 数据库连接 DSN
    dsn: "postgres://postgres:your_password@127.0.0.1:5432/test?sslmode=disable"
    # 从库 DSN 列表（可选，支持多个从库读写分离）
    # slave:
    #   - "postgres://postgres:password@127.0.0.1:5433/dbname?sslmode=disable"

redis:
  default:
    # 单机模式: 填1个地址; 集群模式: 填多个种子节点
    address: ["127.0.0.1:6379"]
    db: 0
    # username: ""
    # password: ""
    # poolSize: 200
    # minIdleConns: 10
    # maxIdleConns: 50
    # connMaxIdleTime: "5m"
    # connMaxLifetime: "1h"
    # poolTimeout: "5s"
    # dialTimeout: "5s"
    # readTimeout: "3s"
    # writeTimeout: "3s"

logger:
  level: "info"
